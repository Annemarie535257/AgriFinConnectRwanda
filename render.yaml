services:
  - type: web
    name: agrifinconnect-backend
    runtime: python
    region: oregon        # change to your preferred region
    plan: free

    # Build: install dependencies from the single root requirements file
    buildCommand: >
      pip install -r requirements.txt
      && cd backend
      && python manage.py collectstatic --noinput
      && python manage.py migrate --noinput

    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    envVars:
      # ── Skip LFS downloads during git clone (model files are not needed on Render) ──
      - key: GIT_LFS_SKIP_SMUDGE
        value: "1"

      # ── Django core ──
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure value on first deploy

      # ── Database (PostgreSQL on Render) ──
      # Render sets DATABASE_URL automatically when you attach a PostgreSQL service.
      # If using SQLite (free tier without Postgres), remove this comment and leave DATABASE_URL unset.
      - key: DATABASE_URL
        fromDatabase:
          name: agrifinconnect-db
          property: connectionString

      # ── CORS / Frontend ──
      - key: CORS_ALLOWED_ORIGINS
        value: "https://agrifinconnect.online"

      # ── Email (password reset) ──
      # Use an SMTP provider (e.g., Gmail app password, SendGrid, Mailgun, Brevo).
      # For Gmail: EMAIL_HOST=smtp.gmail.com, EMAIL_PORT=587, EMAIL_USE_TLS=1.
      - key: DJANGO_EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_FROM_EMAIL
        value: "noreply@agrifinconnect.rw"
      - key: PASSWORD_RESET_FRONTEND_URL
        value: "https://agrifinconnect.online"

      # ── Chatbot model ──
      # Set CHATBOT_DISABLED=1 to disable chatbot and return static fallback reply.
      - key: CHATBOT_DISABLED
        value: "1"

databases:
  - name: agrifinconnect-db
    databaseName: agrifinconnect
    plan: free
