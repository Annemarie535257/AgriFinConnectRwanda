# Netlify build for AgriFinConnect Rwanda frontend (monorepo: frontend is in /frontend)
[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Skip Git LFS downloads — the frontend build does not need the large model files
# (AI_Chatbot_model/model.safetensors etc.). The chatbot calls HF Inference API directly.
[build.environment]
  GIT_LFS_ENABLED = "false"

# With base = "frontend", all paths are relative to the frontend/ directory.
# So this resolves to frontend/netlify/functions/ — where chat.js now lives.
[functions]
  directory = "netlify/functions"

# SPA: serve index.html for client-side routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
